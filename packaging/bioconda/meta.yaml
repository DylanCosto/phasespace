# Bioconda recipe for PhaseSpace. Submit as recipes/phasespace-vcf/meta.yaml in a
# pull request to https://github.com/bioconda/bioconda-recipes after the PyPI release.
# Fill in sha256 with: curl -sL <url> | sha256sum
{% set name = "phasespace-vcf" %}
{% set version = "0.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/phasespace_vcf-{{ version }}.tar.gz
  sha256: FILL_IN_AFTER_PYPI_RELEASE

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - phasespace = phasespace.cli:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
  run:
    - python >=3.10
    - pysam >=0.23,<0.25

test:
  imports:
    - phasespace
  commands:
    - phasespace --version
    - phasespace demo --out demo.html

about:
  home: https://github.com/DylanCosto/phasespace
  summary: Explore how unresolved phase changes the coding consequences of called variants
  description: |
    PhaseSpace reads a VCF/gVCF, reference and annotation, enumerates every phase
    arrangement of the called heterozygous variants in a transcript, and reports
    which arrangements keep a copy with the reference protein. It scans whole
    annotations, uses phased VCFs and read-backed evidence from BAM/CRAM, and
    writes self-contained interactive HTML reports.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/DylanCosto/phasespace

extra:
  recipe-maintainers:
    - DylanCosto
