name: phasespace_scan
description: Rank genes where unresolved phase decides whether a copy keeps the reference protein
keywords: [phasing, compound heterozygous, vcf, gvcf, coding consequence]
tools:
  - phasespace:
      description: Explore phase uncertainty and joint coding consequences in VCF/gVCF data
      homepage: https://github.com/DylanCosto/phasespace
      licence: ["MIT"]
input:
  - - meta: {type: map, description: "Sample information, e.g. [ id:'HG002', sample:'HG002' ]"}
    - vcf: {type: file, description: VCF/gVCF/BCF (bgzipped and indexed), pattern: "*.{vcf.gz,bcf}"}
    - vcf_index: {type: file, description: Index for the VCF, pattern: "*.{tbi,csi}"}
    - phased_vcf: {type: file, description: Optional phased VCF for --phase-from; pass [] when absent}
    - reads: {type: file, description: Optional BAM/CRAM file(s) for read evidence; pass [] when absent}
    - reads_index: {type: file, description: Indexes for the reads}
  - - meta2: {type: map, description: Reference information}
    - fasta: {type: file, description: Reference FASTA (plain or bgzipped)}
    - fasta_index: {type: file, description: ".fai, and .gzi for bgzipped FASTA"}
  - annotation: {type: file, description: GTF or GFF3 annotation (gzipped is fine)}
  - genes: {type: file, description: Optional gene list, one per line; pass [] for all genes}
output:
  - tsv: {type: file, description: Ranked genes, pattern: "*/scan.tsv"}
  - json: {type: file, description: Ranked genes with run summary, pattern: "*/scan.json"}
  - html: {type: file, description: Self-contained sortable index, pattern: "*/index.html"}
  - reports: {type: directory, description: Self-contained per-gene HTML reports}
  - versions: {type: file, description: Software versions, pattern: "versions.yml"}
authors: ["@DylanCosto"]
