[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phasespace-vcf"
version = "0.2.0"
description = "Explore phase uncertainty and joint coding consequences in local VCF/gVCF data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pysam>=0.23,<0.25"]
authors = [{name = "Dylan Costo"}]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["phasing", "compound heterozygous", "VCF", "gVCF", "haplotype", "coding consequence", "long reads"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/DylanCosto/phasespace"
Documentation = "https://github.com/DylanCosto/phasespace#readme"
Issues = "https://github.com/DylanCosto/phasespace/issues"
Changelog = "https://github.com/DylanCosto/phasespace/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
phasespace = "phasespace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phasespace = ["assets/*.html", "assets/*.css", "assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
