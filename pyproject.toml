[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phasespace-vcf"
version = "0.1.0"
description = "Explore phase uncertainty and joint coding consequences in local VCF/gVCF data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pysam>=0.23,<0.25"]
authors = [{name = "Dylan Costo"}]
classifiers = ["Development Status :: 3 - Alpha", "Topic :: Scientific/Engineering :: Bio-Informatics", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
phasespace = "phasespace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phasespace = ["assets/*.html", "assets/*.css", "assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
