name: release
# On a v* tag: build, test the built wheel, publish to PyPI with trusted publishing
# (no stored token) and create a GitHub release. One-time setup on pypi.org:
# add a trusted publisher for project "phasespace-vcf", owner DylanCosto,
# repository phasespace, workflow release.yml, environment pypi.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Test the built wheel outside the checkout
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-test/bin/phasespace demo --out /tmp/demo.html
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release with changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v" " {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "PhaseSpace $version" --notes-file notes.md
